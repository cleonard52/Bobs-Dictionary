
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Dodger 🚀</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #080b20;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  h1 { color: #64f7ff; text-shadow: 0 0 15px #00c8ff; }
  #stats { font-size: 18px; margin: 12px; }
  canvas {
    display: block;
    margin: 0 auto;
    width: min(95vw, 420px);
    height: auto;
    background: #101735;
    border: 2px solid #64f7ff;
    border-radius: 12px;
    touch-action: none;
  }
  button {
    margin: 8px;
    padding: 12px 22px;
    border: 0;
    border-radius: 8px;
    background: #64f7ff;
    color: #080b20;
    font-weight: bold;
    cursor: pointer;
  }
  p { color: #c9d5ff; }
</style>
</head>
<body>
<h1>🚀 STAR DODGER</h1>
<div id="stats">
  Score: <span id="score">0</span> |
  Best: <span id="best">0</span>
</div>
<canvas id="game" width="420" height="560"></canvas>
<button id="start">Start / Restart</button>
<p>Move with ← → or A / D. On mobile, drag your ship!</p>
<p>Dodge asteroids ☄️ and collect stars ⭐</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

let best = 0;
try {
  best = Number(localStorage.getItem("starBest")) || 0;
} catch {}
bestEl.textContent = best;

let player, rocks, stars, score, running, frame, keys;

function reset() {
  player = { x: 190, y: 475, w: 40, h: 40, speed: 6 };
  rocks = [];
  stars = [];
  score = 0;
  frame = 0;
  keys = {};
  running = true;
  scoreEl.textContent = score;
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick = reset;

document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key))
    e.preventDefault();
  keys[e.key.toLowerCase()] = true;
});
document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function moveToPointer(e) {
  const rect = canvas.getBoundingClientRect();
  player.x = (e.clientX - rect.left) * canvas.width / rect.width
             - player.w / 2;
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
}
canvas.addEventListener("pointerdown", e => {
  if (running) moveToPointer(e);
});
canvas.addEventListener("pointermove", e => {
  if (running && e.buttons) moveToPointer(e);
});

function hit(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function endGame() {
  running = false;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem("starBest", best); } catch {}
  }
  draw();
  ctx.fillStyle = "rgba(0,0,0,.78)";
  ctx.fillRect(25, 205, 370, 140);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff638b";
  ctx.font = "bold 34px Arial";
  ctx.fillText("GAME OVER", 210, 255);
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 210, 290);
  ctx.font = "15px Arial";
  ctx.fillText("Press Start / Restart to play again", 210, 320);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Stars in the background
  for (let i = 0; i < 65; i++) {
    let x = (i * 79) % 420;
    let y = (i * 113 + frame * 1.3) % 560;
    ctx.fillStyle = "#899acb";
    ctx.fillRect(x, y, 2, 2);
  }

  // Player spaceship
  ctx.font = "36px Arial";
  ctx.textAlign = "center";
  ctx.fillText("🚀", player.x + 20, player.y + 34);

  // Asteroids
  rocks.forEach(r => {
    ctx.font = "30px Arial";
    ctx.fillText("☄️", r.x + r.w / 2, r.y + r.h);
  });

  // Collectible stars
  stars.forEach(s => {
    ctx.font = "25px Arial";
    ctx.fillText("⭐", s.x + 12, s.y + 24);
  });
}

function loop() {
  if (!running) return;
  frame++;

  if (keys["arrowleft"] || keys["a"]) player.x -= player.speed;
  if (keys["arrowright"] || keys["d"]) player.x += player.speed;
  player.x = Math.max(0, Math.min(380, player.x));

  if (frame % Math.max(15, 42 - Math.floor(score / 100)) === 0) {
    rocks.push({
      x: Math.random() * 380,
      y: -30, w: 34, h: 34,
      speed: 2.5 + Math.random() * 2 + score / 500
    });
  }

  if (frame % 95 === 0) {
    stars.push({ x: 15 + Math.random() * 370, y: -25, w: 24, h: 24 });
  }

  rocks.forEach(r => r.y += r.speed);
  stars.forEach(s => s.y += 3);

  for (const r of rocks) {
    if (hit(player, r)) {
      endGame();
      return;
    }
  }

  stars = stars.filter(s => {
    if (hit(player, s)) {
      score += 25;
      scoreEl.textContent = score;
      return false;
    }
    return s.y < 580;
  });

  rocks = rocks.filter(r => r.y < 590);

  if (frame % 6 === 0) {
    score++;
    scoreEl.textContent = score;
  }

  draw();
  requestAnimationFrame(loop);
}

draw();
ctx.fillStyle = "white";
ctx.textAlign = "center";
ctx.font = "22px Arial";
ctx.fillText("Ready for launch?", 210, 250);
ctx.font = "16px Arial";
ctx.fillText("Click Start to begin!", 210, 280);
</script>
</body>
</html>
