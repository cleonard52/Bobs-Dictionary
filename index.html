<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Dodger Arcade</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b16;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        #scoreBoard {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        #gameCanvas {
            border: 4px solid #3a3a5c;
            background-color: #121224;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            text-align: center;
            background: rgba(11, 11, 22, 0.9);
            padding: 30px;
            border: 2px solid #ff4a4a;
            border-radius: 10px;
        }
        .btn {
            background-color: #00ffcc;
            color: #0b0b16;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #00e6b8;
        }
    </style>
</head>
<body>

    <h1>SPACE DODGER</h1>
    <div id="scoreBoard">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <div id="gameOverScreen">
        <h2 style="color: #ff4a4a; font-size: 2.5rem; margin: 0;">GAME OVER</h2>
        <p>Your ship was destroyed!</p>
        <button class="btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const gameOverScreen = document.getElementById("gameOverScreen");

        // Game Configuration
        let score = 0;
        let gameActive = true;
        
        // Player Ship setup
        const player = {
            x: 180,
            y: 440,
            width: 40,
            height: 30,
            speed: 7
        };

        // Obstacles (Meteors) setup
        let enemies = [];
        let enemySpeed = 3;
        let spawnRate = 0.03; // Chance to spawn per frame

        // Key tracking
        const keys = { ArrowLeft: false, ArrowRight: false };

        window.addEventListener("keydown", (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { if (e.key in keys) keys[e.key] = false; });

        function spawnEnemy() {
            if (Math.random() < spawnRate) {
                let size = Math.random() * 20 + 15; // Random sizes
                enemies.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    width: size,
                    height: size,
                    speed: enemySpeed + Math.random() * 2 // Some are slightly faster
                });
            }
        }

        function update() {
            if (!gameActive) return;

            // Move ship left or right
            if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
            if (keys.ArrowRight && player.x < canvas.width - player.width) player.x += player.speed;

            // Manage enemies
            spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                // Collision detection (Does meteor hit player ship?)
                if (enemies[i].x < player.x + player.width &&
                    enemies[i].x + enemies[i].width > player.x &&
                    enemies[i].y < player.y + player.height &&
                    enemies[i].y + enemies[i].height > player.y) {
                        gameActive = false;
                        gameOverScreen.style.display = "block";
                }

                // Score point if meteor safely hits the bottom wall
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    score++;
                    scoreDisplay.textContent = score;

                    // Gradually speed up game as points increase
                    if (score % 10 === 0) {
                        enemySpeed += 0.5;
                        spawnRate += 0.005;
                    }
                }
            }
        }

        function draw() {
            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Neon Spaceship
            ctx.fillStyle = "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y); // Nose cone
            ctx.lineTo(player.x, player.y + player.height); // Left wing
            ctx.lineTo(player.x + player.width, player.y + player.height); // Right wing
            ctx.closePath();
            ctx.fill();

            // Draw Falling Meteors
            ctx.fillStyle = "#ff4a4a";
            for (let enemy of enemies) {
                ctx.beginPath();
                ctx.arc(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.width/2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            enemies = [];
            score = 0;
            enemySpeed = 3;
            spawnRate = 0.03;
            player.x = 180;
            scoreDisplay.textContent = score;
            gameOverScreen.style.display = "none";
            gameActive = true;
        }

        // Initialize Engine
        gameLoop();
    </script>
</body>
</html>
